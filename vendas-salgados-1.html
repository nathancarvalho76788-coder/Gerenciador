<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#FAF3E4; --ink:#2B1B12; --gold:#C7841E; --gold-deep:#A6650F;
    --paprika:#8C2F1B; --green:#3F6C4B; --line:#E4D6BA; --card:#FFFFFF;
    --muted:#8A7A63;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --paper:#1C140D; --ink:#F3E9D8; --card:#2A2016; --line:#4A3A26; --muted:#B6A488;
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C140D; --ink:#F3E9D8; --card:#2A2016; --line:#4A3A26; --muted:#B6A488;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Work Sans',sans-serif; min-height:100%;
    padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  header{
    position:sticky; top:0; z-index:5; background:var(--paper);
    padding:calc(16px + env(safe-area-inset-top,0px)) 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .titlebar{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .titlebar h1{font-size:22px; font-weight:700;}
  .badges{display:flex; align-items:center; gap:8px;}
  .badges .data{font-size:13px; color:var(--muted); text-transform:capitalize;}
  .aovivo{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--green); font-weight:600;}
  .aovivo .dot{width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulso 1.6s infinite;}
  @keyframes pulso{0%,100%{opacity:1;}50%{opacity:.35;}}
  .erroCon{font-size:11px; color:var(--paprika); background:var(--card); border:1px solid var(--line); padding:2px 8px; border-radius:8px;}
  .totalhoje{margin-top:10px; display:flex; align-items:baseline; gap:8px;}
  .totalhoje .num{font-family:'Fraunces',serif; font-size:38px; font-weight:700; color:var(--gold-deep);}
  .totalhoje .lbl{font-size:13px; color:var(--muted);}
  main{padding:16px 18px 24px; max-width:640px; margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .prodcard{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .prodcard:active{transform:scale(0.97);}
  .prodcard .nome{font-weight:600; font-size:15px; display:block; margin-bottom:6px;}
  .prodcard .preco{font-family:'Fraunces',serif; font-size:19px; color:var(--gold-deep);}
  .empty{color:var(--muted); font-size:14px; padding:30px 6px; text-align:center;}
  .painel{
    margin-top:14px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:16px; animation:up .15s ease;
  }
  @keyframes up{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .painel .nomeSel{font-size:16px; font-weight:600;}
  .qtdrow{display:flex; align-items:center; gap:14px; margin:14px 0;}
  .qtdrow button{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:18px; cursor:pointer;
  }
  .qtdrow .qtdval{font-size:18px; font-weight:600; min-width:24px; text-align:center;}
  .paybtns{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .paybtns button{
    padding:12px 4px; border-radius:12px; border:1px solid var(--line); background:var(--paper);
    color:var(--ink); font-weight:600; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .paybtns button:active{background:var(--gold); color:#fff; border-color:var(--gold);}
  .cancelar{display:block; margin:10px auto 0; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline;}
  .cardform{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .campo{margin-bottom:10px;}
  .campo label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .campo input{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:15px; font-family:inherit;
  }
  .btn-add{
    width:100%; padding:12px; border-radius:10px; border:none; background:var(--gold-deep);
    color:#fff; font-weight:600; font-size:15px; cursor:pointer; font-family:inherit;
  }
  .listaprod{display:flex; flex-direction:column; gap:8px;}
  .itemprod{
    display:flex; justify-content:space-between; align-items:center; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .itemprod .nome{font-weight:600;}
  .itemprod .preco{color:var(--muted); font-size:13px;}
  .itemprod button{
    background:none; border:1px solid var(--line); color:var(--paprika); border-radius:8px;
    padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .datepick{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .datepick input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-family:inherit; font-size:14px;
  }
  .resumocards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .rescard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .rescard.full{grid-column:1/-1; background:linear-gradient(135deg,var(--gold-deep),var(--gold)); color:#fff; border:none;}
  .rescard .lbl{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .rescard.full .lbl{color:rgba(255,255,255,.85);}
  .rescard .val{font-family:'Fraunces',serif; font-size:22px; font-weight:700;}
  .rescard.full .val{font-size:30px;}
  .histitem{
    display:flex; justify-content:space-between; align-items:center; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:14px;
  }
  .histitem:last-child{border-bottom:none;}
  .histitem .desc{font-weight:500;}
  .histitem .tag{font-size:11px; color:var(--muted);}
  .histitem .val{font-weight:600;}
  .histitem .del{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; margin-left:8px;}
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:6;
  }
  nav.tabs button{
    flex:1; padding:12px 4px 10px; background:none; border:none; color:var(--muted);
    font-family:inherit; font-size:12px; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:3px;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--gold-deep); font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>Minhas Vendas</h1>
    <div class="badges">
      <span class="erroCon" id="badgeErro" style="display:none;">sem conexão</span>
      <span class="aovivo" id="badgeAoVivo" style="display:none;"><span class="dot"></span>ao vivo</span>
      <span class="data" id="dataHoje"></span>
    </div>
  </div>
  <div class="totalhoje">
    <span class="num" id="totalHojeNum">R$ 0,00</span>
    <span class="lbl">recebido hoje</span>
  </div>
</header>

<main>
  <div class="view active" id="view-vender">
    <div id="gridProdutos" class="grid"></div>
    <div id="painelVenda"></div>
  </div>

  <div class="view" id="view-produtos">
    <div class="cardform">
      <div class="campo"><label>Nome do produto</label><input id="inNome" placeholder="Ex: Coxinha"></div>
      <div class="campo"><label>Preço (R$)</label><input id="inPreco" type="number" step="0.01" placeholder="Ex: 6.00"></div>
      <button class="btn-add" onclick="adicionarProduto()">Adicionar produto</button>
    </div>
    <div class="listaprod" id="listaProdutos"></div>
  </div>

  <div class="view" id="view-resumo">
    <div class="datepick">
      <input type="date" id="dataResumo">
    </div>
    <div class="resumocards">
      <div class="rescard full"><div class="lbl">Total do dia</div><div class="val" id="resTotal">R$ 0,00</div></div>
      <div class="rescard"><div class="lbl">Dinheiro</div><div class="val" id="resDinheiro">R$ 0,00</div></div>
      <div class="rescard"><div class="lbl">Cartão</div><div class="val" id="resCartao">R$ 0,00</div></div>
      <div class="rescard"><div class="lbl">Pix</div><div class="val" id="resPix">R$ 0,00</div></div>
    </div>
    <h3 style="font-size:15px; margin-bottom:8px; font-family:'Work Sans'; font-weight:600;">Vendas do dia</h3>
    <div class="cardform" id="listaHistorico"><div class="empty">Nenhuma venda neste dia.</div></div>
  </div>
</main>

<nav class="tabs">
  <button class="tab active" data-view="vender"><span class="ic">🧆</span>Vender</button>
  <button class="tab" data-view="produtos"><span class="ic">📦</span>Produtos</button>
  <button class="tab" data-view="resumo"><span class="ic">📊</span>Resumo</button>
</nav>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAvxHH8r9n-ev6yUODnwOXMB5HriwjiuDA",
  authDomain: "gerenciador-de-vendas-16b55.firebaseapp.com",
  projectId: "gerenciador-de-vendas-16b55",
  storageBucket: "gerenciador-de-vendas-16b55.firebasestorage.app",
  messagingSenderId: "606654894511",
  appId: "1:606654894511:web:8d5ee9b9ce6151fe335f5a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let PRODUTOS = [];
let VENDAS = [];
let qtdAtual = 1;

function moeda(v){ return 'R$ ' + v.toFixed(2).replace('.',','); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderCabecalho(){
  const d = new Date();
  document.getElementById('dataHoje').textContent = d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'});
  const hoje = hojeISO();
  const total = VENDAS.filter(v=>v.data===hoje).reduce((s,v)=>s+v.preco*v.qtd,0);
  document.getElementById('totalHojeNum').textContent = moeda(total);
}

function renderGridProdutos(){
  const grid = document.getElementById('gridProdutos');
  if(PRODUTOS.length===0){ grid.innerHTML = '<div class="empty">Nenhum produto ainda.</div>'; return; }
  grid.innerHTML = PRODUTOS.map(p=>`<button class="prodcard" onclick="abrirPainel('${p.id}')"><span class="nome">${escapeHtml(p.nome)}</span><span class="preco">${moeda(p.preco)}</span></button>`).join('');
}

function abrirPainel(id){
  const p = PRODUTOS.find(x=>x.id===id);
  if(!p) return;
  qtdAtual = 1;
  document.getElementById('painelVenda').innerHTML = `
    <div class="painel">
      <div class="nomeSel">${escapeHtml(p.nome)} · ${moeda(p.preco)}</div>
      <div class="qtdrow">
        <button onclick="mudarQtd(-1)">–</button>
        <span class="qtdval" id="qtdVal">1</span>
        <button onclick="mudarQtd(1)">+</button>
        <span style="color:var(--muted); font-size:13px;">unidade(s)</span>
      </div>
      <div class="paybtns">
        <button onclick="confirmarVenda('${id}','Dinheiro')">💵 Dinheiro</button>
        <button onclick="confirmarVenda('${id}','Cartão')">💳 Cartão</button>
        <button onclick="confirmarVenda('${id}','Pix')">📲 Pix</button>
      </div>
      <button class="cancelar" onclick="fecharPainel()">cancelar</button>
    </div>`;
}
function mudarQtd(delta){
  qtdAtual = Math.max(1, qtdAtual+delta);
  document.getElementById('qtdVal').textContent = qtdAtual;
}
function fecharPainel(){ document.getElementById('painelVenda').innerHTML=''; }

function confirmarVenda(id, forma){
  const p = PRODUTOS.find(x=>x.id===id);
  if(!p) return;
  fecharPainel();
  db.collection('vendas').add({
    produtoId:p.id, nome:p.nome, preco:p.preco, qtd:qtdAtual, forma:forma,
    data:hojeISO(), hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    ts: Date.now()
  }).catch(()=>alert('Não foi possível salvar a venda agora. Verifique a internet.'));
}

function adicionarProduto(){
  const nome = document.getElementById('inNome').value.trim();
  const preco = parseFloat(document.getElementById('inPreco').value);
  if(!nome || isNaN(preco) || preco<=0){ alert('Preencha nome e preço válidos.'); return; }
  document.getElementById('inNome').value=''; document.getElementById('inPreco').value='';
  db.collection('produtos').add({nome, preco}).catch(()=>alert('Não foi possível salvar o produto agora.'));
}
function removerProduto(id){
  if(!confirm('Remover este produto?')) return;
  db.collection('produtos').doc(id).delete().catch(()=>alert('Não foi possível remover agora.'));
}
function renderListaProdutos(){
  const el = document.getElementById('listaProdutos');
  if(PRODUTOS.length===0){ el.innerHTML='<div class="empty">Nenhum produto cadastrado.</div>'; return; }
  el.innerHTML = PRODUTOS.map(p=>`
    <div class="itemprod">
      <div><div class="nome">${escapeHtml(p.nome)}</div><div class="preco">${moeda(p.preco)}</div></div>
      <button onclick="removerProduto('${p.id}')">remover</button>
    </div>`).join('');
}

function renderResumo(){
  const data = document.getElementById('dataResumo').value || hojeISO();
  const doDia = VENDAS.filter(v=>v.data===data);
  const total = doDia.reduce((s,v)=>s+v.preco*v.qtd,0);
  const porForma = f => doDia.filter(v=>v.forma===f).reduce((s,v)=>s+v.preco*v.qtd,0);
  document.getElementById('resTotal').textContent = moeda(total);
  document.getElementById('resDinheiro').textContent = moeda(porForma('Dinheiro'));
  document.getElementById('resCartao').textContent = moeda(porForma('Cartão'));
  document.getElementById('resPix').textContent = moeda(porForma('Pix'));

  const lista = document.getElementById('listaHistorico');
  if(doDia.length===0){ lista.innerHTML = '<div class="empty">Nenhuma venda neste dia.</div>'; return; }
  const icone = {'Dinheiro':'💵','Cartão':'💳','Pix':'📲'};
  const ordenado = doDia.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).reverse();
  lista.innerHTML = ordenado.map(v=>`
    <div class="histitem">
      <div><div class="desc">${v.qtd}x ${escapeHtml(v.nome)}</div><div class="tag">${icone[v.forma]||''} ${v.forma} · ${v.hora||''}</div></div>
      <div><span class="val">${moeda(v.preco*v.qtd)}</span><button class="del" onclick="removerVenda('${v.id}')">✕</button></div>
    </div>`).join('');
}
function removerVenda(id){
  db.collection('vendas').doc(id).delete().catch(()=>alert('Não foi possível remover agora.'));
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='resumo') renderResumo();
  });
});

document.getElementById('dataResumo').value = hojeISO();
document.getElementById('dataResumo').addEventListener('change', renderResumo);

renderCabecalho();

db.collection('produtos').onSnapshot(snap=>{
  document.getElementById('badgeAoVivo').style.display = 'inline-flex';
  document.getElementById('badgeErro').style.display = 'none';
  PRODUTOS = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderGridProdutos(); renderListaProdutos();
}, ()=>{
  document.getElementById('badgeAoVivo').style.display = 'none';
  document.getElementById('badgeErro').style.display = 'inline-block';
});

db.collection('vendas').onSnapshot(snap=>{
  VENDAS = snap.docs.map(d=>({id:d.id, ...d.data()}));
  renderCabecalho(); renderResumo();
}, ()=>{
  document.getElementById('badgeAoVivo').style.display = 'none';
  document.getElementById('badgeErro').style.display = 'inline-block';
});
</script>
</body>
</html>
